# ──────────────────────────────────────────────────────────────
# config.yaml – All tuneable parameters for the analysis
# Change a threshold, re-run `make run`, and every number updates.
# ──────────────────────────────────────────────────────────────

random_seed: 42

# ── Data paths ────────────────────────────────────────────────
data:
  raw_dir: data/raw
  processed_dir: data/processed
  user_features_parquet: data/processed/user_features.parquet

# ── Observation / outcome windows ─────────────────────────────
# Features are computed ONLY from each user's first 3 orders.
# Outcomes are computed ONLY from orders 4 onward.
observation_window:
  feature_orders: 3        # first N orders → features
  min_total_orders: 4      # users must have at least this many orders

# ── Outcome definitions ──────────────────────────────────────
outcomes:
  # Primary: "heavy user" = total orders >= this percentile's value
  heavy_user:
    percentile: 75           # top quartile
    # The actual threshold (in number of orders) is computed from data
    # and stored in results.json. From the reality check: p75 = 20 orders.

  # Secondary: "fast cadence" = median days_since_prior_order (orders 4+)
  # at or below this value
  fast_cadence:
    max_median_gap_days: 7   # weekly or faster

  # Sensitivity check thresholds (alternative percentiles for heavy user)
  sensitivity:
    percentiles: [70, 80]    # compare top-30% and top-20% definitions

# ── Feature engineering (from orders 1-3 only) ───────────────
features:
  # Time-of-day buckets for "share placed morning/evening"
  morning_hours: [6, 7, 8, 9, 10, 11]      # 6 AM – 11 AM
  evening_hours: [17, 18, 19, 20, 21, 22]   # 5 PM – 10 PM

  # Weekend days (order_dow). 0 and 1 appear to be Sat/Sun based on
  # Instacart's known high weekend volume, but day labels are unconfirmed.
  weekend_days: [0, 1]

  # Key departments to track as share of first-order basket
  tracked_departments:
    - produce
    - dairy eggs
    - snacks
    - beverages
    - frozen

# ── Lifecycle segments ────────────────────────────────────────
# Applied to ALL orders (not just orders 1-3).
lifecycle:
  segments:
    new:
      max_orders: 5
    regular:
      min_orders: 6
      max_median_gap: 14     # days
    slowing:
      min_orders: 6
      min_median_gap: 15     # days

# ── Metrics tree ──────────────────────────────────────────────
metrics:
  north_star: repeat_orders_per_user
  input_metrics:
    - reorder_rate             # share of items that are reorders
    - basket_size              # items per order
    - days_between_orders      # cadence
  guardrails:
    - basket_size_not_shrinking  # nudges should not drive tiny top-up orders
    - order_frequency_quality    # frequency not inflated by split baskets

# ── Bootstrap / statistics ────────────────────────────────────
stats:
  bootstrap_iterations: 10000
  confidence_level: 0.95

# ── Results output ────────────────────────────────────────────
results:
  json_path: results/results.json
  figures_dir: results/figures
